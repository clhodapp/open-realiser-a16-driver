# Standalone PipeWire client configuration; does not restart the system daemon.
context.properties = { log.level = 1 }
context.spa-libs = {
 audio.convert.* = audioconvert/libspa-audioconvert
 support.* = support/libspa-support
}
context.modules = [
 { name = libpipewire-module-rt flags = [ ifexists nofail ] }
 { name = libpipewire-module-protocol-native }
 { name = libpipewire-module-client-node }
 { name = libpipewire-module-adapter }
 { name = libpipewire-module-loopback args = {
 node.description = "Realiser A16 Stereo Upmix (PSD)"
 audio.position = [ FL FR ]
 audio.rate = 48000
 node.latency = 960/48000
 capture.props = {
  node.name = "a16.upmix.stereo"
  node.description = "Realiser A16 Stereo Upmix (PSD)"
  media.class = "Audio/Sink"
  priority.session = 0
  channelmix.upmix = false
 }
 playback.props = {
  node.name = "a16.upmix.output"
  node.description = "A16 PSD surround feed"
  target.object = "ozzy.a16.playback"
  audio.position = [ FL FR FC LFE SL SR RL RR ]
  node.passive = true
  node.dont-fallback = true
  stream.dont-remix = true
  channelmix.upmix = true
  channelmix.upmix-method = psd
  channelmix.lfe-cutoff = 0
  channelmix.mix-lfe = false
  channelmix.fc-cutoff = 12000
  channelmix.rear-delay = 12.0
  channelmix.hilbert-taps = 63
  channelmix.stereo-widen = 0.0
  channelmix.normalize = true
 }
}
 }
]
