name: Bug report
description: Report a Linux A16 driver problem.
body:
  - type: textarea
    attributes:
      label: Problem
      description: What happened, what did you expect, and how can it be reproduced?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Linux distribution, PipeWire version, A16 firmware, selected profile and sample rate.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs
      description: Include the command and relevant driver output.
